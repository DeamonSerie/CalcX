[package]
name = "calcx-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
codec = { workspace = true }
scale-info = { workspace = true, features = ["derive"] }
frame-support = { workspace = true }
frame-system = { workspace = true }
frame-executive = { workspace = true }
sp-core = { workspace = true }
sp-runtime = { workspace = true }
sp-io = { workspace = true }
sp-std = { workspace = true }
sp-api = { workspace = true }
sp-block-builder = { workspace = true }
sp-consensus-aura = { workspace = true }
sp-consensus-grandpa = { workspace = true }
sp-genesis-builder = { workspace = true }
sp-inherents = { workspace = true }
sp-offchain = { workspace = true }
sp-session = { workspace = true }
sp-transaction-pool = { workspace = true }
sp-version = { workspace = true }
sp-weights = { workspace = true }
pallet-balances = { workspace = true }
pallet-timestamp = { workspace = true }
pallet-aura = { workspace = true }
pallet-grandpa = { workspace = true }
pallet-assets = { workspace = true }
pallet-contracts = { workspace = true }
pallet-collective = { workspace = true }
pallet-sudo = { workspace = true }
pallet-transaction-payment = { workspace = true }
pallet-calcx = { path = "../pallets/pallet-calcx", default-features = false }
pallet-time-n = { path = "../pallets/pallet-time-n", default-features = false }
pallet-node-rewards = { path = "../pallets/pallet-node-rewards", default-features = false }

[features]
default = ["std"]
std = [
  "codec/std",
  "scale-info/std",
  "frame-support/std",
  "frame-system/std",
  "frame-executive/std",
  "sp-core/std",
  "sp-runtime/std",
  "sp-io/std",
  "sp-std/std",
  "sp-api/std",
  "sp-block-builder/std",
  "sp-consensus-aura/std",
  "sp-consensus-grandpa/std",
  "sp-genesis-builder/std",
  "sp-inherents/std",
  "sp-offchain/std",
  "sp-session/std",
  "sp-transaction-pool/std",
  "sp-version/std",
  "sp-weights/std",
  "pallet-balances/std",
  "pallet-timestamp/std",
  "pallet-aura/std",
  "pallet-grandpa/std",
  "pallet-assets/std",
  "pallet-contracts/std",
  "pallet-collective/std",
  "pallet-sudo/std",
  "pallet-transaction-payment/std",
  "pallet-calcx/std",
  "pallet-time-n/std",
  "pallet-node-rewards/std",
]
